<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Massive Mission Solutions: Learn. Engineer. Build What Matters.</title>
<meta name="description" content="AI Engineering and Software Engineering training, plus AI solutions for businesses, from Massive Mission Solutions.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8FD;--ink:#0A1033;--mute:#4B5578;--line:#D8DEEE;--green:#2447E0;--soft:#EAEFFB;--on:#FFFFFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080D22;--ink:#EEF2FF;--mute:#A4AFD0;--line:#222C52;--green:#4DD6E8;--soft:#0E1633;--on:#080D22}}
:root[data-theme="dark"]{--bg:#080D22;--ink:#EEF2FF;--mute:#A4AFD0;--line:#222C52;--green:#4DD6E8;--soft:#0E1633;--on:#080D22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800}
h2{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0 0 1em;max-width:68ch}
a{color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 1.05rem "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav a{display:block;padding:8px 10px;text-decoration:none;font-size:.92rem;font-weight:500;color:var(--mute);border-bottom:2px solid transparent}
nav a:hover,nav a[aria-current]{color:var(--ink);border-color:var(--green)}
#menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);padding:8px 12px;font:inherit;border-radius:6px}
@media(max-width:900px){#menu{display:block}nav{display:none;width:100%}nav.open{display:block}.bar{flex-wrap:wrap;padding:10px 0}nav ul{flex-direction:column;padding-bottom:10px}}
.dd{position:relative}
.dd>button{display:flex;align-items:center;gap:8px;padding:8px 10px;background:none;border:0;border-bottom:2px solid transparent;font:500 .92rem "IBM Plex Sans",sans-serif;color:var(--mute);cursor:pointer}
.dd>button::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px)}
.dd>button:hover,.dd>button.on,.dd.open>button{color:var(--ink);border-color:var(--green)}
.dd .sub{display:none;position:absolute;top:100%;left:0;min-width:210px;flex-direction:column;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;z-index:6}
.dd.open .sub{display:flex}
@media(hover:hover) and (min-width:901px){.dd:hover .sub{display:flex}}
@media(max-width:900px){.dd>button{width:100%;justify-content:space-between}.dd .sub{position:static;border:0;padding:0 0 0 14px}}
section{padding:72px 0}
.alt{background:var(--soft)}
.btn{display:inline-block;padding:13px 22px;border-radius:6px;font-weight:600;text-decoration:none;border:2px solid var(--ink);margin:0 10px 10px 0;cursor:pointer;font-family:inherit;font-size:1rem}
.btn.p{background:var(--ink);color:var(--bg)}
.btn:hover{border-color:var(--green)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
.lead{font-size:1.15rem;color:var(--mute)}
.rows>*{padding:22px 0 22px 20px;border-left:3px solid var(--line);margin-bottom:6px}
.rows>*:hover{border-color:var(--green)}
.rows h3{margin-bottom:.3em}.rows p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border:1px solid var(--green);color:var(--green);border-radius:99px;margin-bottom:8px}
.tag.n{border-color:var(--mute);color:var(--mute)}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
ol.steps li{counter-increment:s;border-top:3px solid var(--green);padding-top:10px}
ol.steps li::before{content:counter(s);font:700 1.4rem "Bricolage Grotesque";color:var(--green);display:block}
ul.chk{padding-left:1.1em}ul.chk li{margin-bottom:.4em}
.note{border-left:4px solid var(--green);background:var(--soft);padding:14px 18px;color:var(--mute);max-width:68ch}
.alt .note{background:var(--bg)}
label{display:block;font-weight:600;margin:16px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--mute);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.err{color:#B3261E;font-size:.9rem;min-height:1.2em;margin:4px 0 0}
@media(prefers-color-scheme:dark){.err{color:#FF8A80}}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--line);padding:40px 0;color:var(--mute);font-size:.95rem}
footer .grid{gap:20px}footer a{display:block;text-decoration:none;padding:2px 0}
.flow{stroke-dasharray:6 6;animation:d 1.6s linear infinite}
@keyframes d{to{stroke-dashoffset:-24}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
header{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.dark{--g2:#4DD6E8;background:radial-gradient(800px 420px at 85% 15%,rgba(124,77,255,.3),transparent 70%),#070C24;color:#EEF2FF;padding:64px 0}
.dark .lead{color:#B8C2D6}
.dark h1 .g{color:var(--g2)}
.dark .btn{border-color:#F2EFE6;color:#F2EFE6}
.dark .btn.p{background:var(--g2);border-color:var(--g2);color:#06121F}
.dark .btn:hover{border-color:#fff}
.term{font:500 .9rem ui-monospace,Menlo,Consolas,monospace;color:var(--g2);margin-bottom:16px}
.term::after{content:"▍";margin-left:4px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#net{width:100%;height:420px;display:block;cursor:crosshair}
@media(max-width:860px){#net{height:300px}}
.rows{perspective:900px}
.rows>*{border-radius:0 12px 12px 0;padding-right:16px;transition:transform .25s,background .25s,box-shadow .25s}
.rows>*:hover{transform:translateY(-4px) rotateX(4deg);background:var(--soft);box-shadow:0 12px 24px -12px rgba(14,27,51,.35)}
.alt .rows>*:hover{background:var(--bg)}
.btn{transition:transform .2s}.btn:hover{transform:translateY(-2px)}
.rv{opacity:0;transform:translateY(28px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.term::after{animation:none}.rows>*:hover{transform:none}.rv{opacity:1;transform:none}}
.sr{position:absolute;left:-999px}.sr:focus{left:8px;top:8px;background:var(--bg);padding:8px;z-index:9}
</style>
</head>

<header><div class="wrap bar">
<a class="brand" href="#/" aria-label="Massive Mission Solutions home">

Massive Mission Solutions</a>
<button id="menu" aria-expanded="false" aria-controls="nav">Menu</button>
<nav id="nav" aria-label="Main"><ul id="navlist"></ul></nav>
</div></header>
<main id="main" tabindex="-1"></main>
<footer><div class="wrap grid">
<div><strong>Massive Mission Solutions</strong><br>Learn. Engineer. Build What Matters.</div>
<div id="foot"></div>
<div>Email: <a id="mail" href="#"></a><br>Programs, fees and policies are published on each page before enrolment.</div>
</div></footer>

<script>
/* ===== EDITABLE CONTENT: change values here; pages rebuild automatically ===== */
const SITE={whatsapp:"919177059193",email:"hr@massivemissionskills.com",divisions:{academy:"Massive Mission Academy",labs:"Massive Mission Labs"}};
const TBC='To be confirmed before launch';
const PROGRAMS={
 ai:{title:"AI Engineering",tag:"Learn to design and build AI-powered applications.",
  topics:["Python for AI work","Machine learning basics","Generative AI and prompting","LLM applications","Retrieval-augmented generation (RAG)","AI agents and tool use","Evaluation and testing","Deployment and monitoring"],
  projects:["A document Q&A assistant with cited sources","An evaluation harness that scores answers against a test set","A tool-using agent with logging and guardrails"],
  outcomes:["Build and deploy a small LLM application end to end","Measure answer quality instead of guessing","Explain the limits and risks of your system"],
  prereq:"Basic programming in any language and comfort with the command line.",tools:["Python","Jupyter","LLM APIs","Vector databases","Git and GitHub","Docker basics"],who:"Programmers and technical learners who want to build LLM applications."},
 sde:{title:"Software Engineering",tag:"Develop the fundamentals required to build reliable software.",
  topics:["Programming fundamentals","Data structures and algorithms","React and front-end development","Backend development","Databases","APIs","Testing","System design","GitHub workflow","Deployment","AI-assisted development"],
  projects:["A REST API with a database and automated tests","A React app that consumes your own API","A code review exercise on a real pull request"],
  outcomes:["Ship a tested, deployed full-stack application","Work in a Git-based team workflow","Reason about trade-offs in simple system designs"],
  prereq:"No prior experience required. Willingness to practise weekly.",tools:["JavaScript or Python","React","Backend frameworks","SQL databases","REST APIs","Git and GitHub","Testing frameworks"],who:"Beginners, students and career switchers who want solid engineering foundations."}
};
const ROADMAP=["Programming basics","Data structures and algorithms","Databases and APIs","React and backend","Testing and GitHub","System design and deployment"];
const SERVICES=[
 ["AI application development","Teams need a working AI feature, not a demo.","Prototype first, then harden with tests and monitoring.","Working application, source code, documentation."],
 ["Business workflow automation","Repeated manual steps slow staff down.","Map the workflow, automate the stable parts, keep a human check where errors are costly.","Automated workflow, runbook, handover session."],
 ["Knowledge assistants","Answers are buried in documents.","RAG over approved sources with citations and access control.","Assistant, evaluation report, content update process."],
 ["AI agents","Multi-step tasks need tools and decisions.","Narrow scope, explicit tools, logging and fallbacks.","Agent, test scenarios, safety limits document."],
 ["Intelligent search","Keyword search misses meaning.","Hybrid keyword and semantic search with relevance testing.","Search service, relevance test set."],
 ["SaaS development","A product idea needs an engineering team.","Incremental delivery with working releases.","Deployed product, repository, documentation."],
 ["AI integrations","Existing systems need AI capabilities.","API-first integration with fallbacks and privacy review.","Integration, tests, monitoring."]
];
const PROCESS=["Discovery","Feasibility","Prototype","Development","Testing","Deployment","Maintenance"];
const PROJECTS=[
 {status:"Concept demonstration",name:"Document Q&A reference architecture",problem:"Staff cannot find answers across policy documents.",arch:"Ingest, chunk, embed, retrieve, generate with citations.",tools:"Python, a vector index, an LLM API.",testing:"Planned: a question set with expected sources.",limits:"Concept only. No production data and no measured results yet.",outcome:"None claimed."}
];
const TEAM=[{name:"Founder / Lead Engineer",role:"Profile to be added",bio:"Add real experience, projects and links here."},{name:"Instructor",role:"Profile to be added",bio:"Add real teaching and industry background here."}];
const ARTICLES=[["How to evaluate a RAG system before trusting it","Why a small test set beats intuition."],["Choosing between a workflow and an agent","When fixed steps are the safer design."],["Testing habits every new engineer needs","Small tests that catch real bugs."]];
const FAQ=[["Do you guarantee jobs or salaries?","No. We teach skills and show your work. We do not promise placements."],["What are the fees and refund terms?","Published on each program page before enrolment. "+TBC+"."],["Do you work with confidential data?","Only under a written agreement. Privacy and access are discussed in discovery."]];
const ROUTES={"/":"Home","/ai-engineering":"AI Engineering","/sde":"SDE Training","/ai-solutions":"AI Solutions","/projects":"Projects","/about":"About","/insights":"Insights","/contact":"Contact"};

/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const li=a=>a.map(x=>`<li>${x}</li>`).join("");
const sec=(h,b,alt)=>`<section class="${alt?'alt':''}"><div class="wrap"><h2>${h}</h2>${b}</div></section>`;
const cta=(t,h,p)=>`<a class="btn ${p?'p':''}" href="${h}">${t}</a>`;
const closer=(t,btn,h)=>sec(t,`<p class="lead">Tell us where you are and we will reply with a clear next step.</p>${cta(btn,h,1)}`,1);

function arch(){return `<svg viewBox="0 0 440 340" role="img" aria-label="Architecture of a retrieval-augmented AI assistant: documents flow through an index and retriever to a language model, then to an answer with citations, with an evaluation loop." style="width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--soft)">
<g font-family="IBM Plex Sans,sans-serif" font-size="13" fill="currentColor" stroke="currentColor">
<g fill="none" stroke-width="1.5"><rect x="20" y="30" width="110" height="46" rx="4"/><rect x="165" y="30" width="110" height="46" rx="4"/><rect x="310" y="30" width="110" height="46" rx="4"/><rect x="20" y="150" width="110" height="46" rx="4"/><rect x="165" y="150" width="110" height="46" rx="4" style="stroke:var(--green)" stroke-width="2.5"/><rect x="310" y="150" width="110" height="46" rx="4"/><rect x="165" y="265" width="110" height="46" rx="4"/></g>
<g style="stroke:var(--green)" stroke-width="2" fill="none" class="flow"><path d="M130 53H165M275 53H310M365 76V150M310 173H275M165 173H130M220 196V265"/></g>
<g stroke="none"><text x="75" y="58" text-anchor="middle">Documents</text><text x="220" y="58" text-anchor="middle">Chunk + embed</text><text x="365" y="58" text-anchor="middle">Index</text><text x="75" y="178" text-anchor="middle">Answer + cites</text><text x="220" y="178" text-anchor="middle">LLM</text><text x="365" y="178" text-anchor="middle">Retriever</text><text x="220" y="293" text-anchor="middle">Evaluation set</text></g></g></svg>`}

/* ===== pages ===== */
function program(k){const p=PROGRAMS[k];return `
<section><div class="wrap"><h1>${p.title} Training</h1><p class="lead">${p.tag}</p>${cta("Ask about enrolment","#/contact?topic="+encodeURIComponent(p.title),1)}</div></section>
${sec("Curriculum",`<ul class="chk">${li(p.topics)}</ul>`,1)}
${sec("Who it is for, and tools",`<p>${p.who}</p><p><strong>Tools you will use</strong></p><div>${p.tools.map(t=>`<span class="tag n">${t}</span> `).join("")}</div>`)}
${k=="sde"?sec("Learning roadmap",`<ol class="steps">${li(ROADMAP)}</ol>`):""}
${sec(k=="sde"?"Practical assignments":"Project examples",`<ul class="chk">${li(p.projects)}</ul>`,k!="sde")}
${sec("Learning outcomes",`<ul class="chk">${li(p.outcomes)}</ul>`,k=="sde")}
${sec("Program details",`<div class="rows"><div><h3>Prerequisites</h3><p>${p.prereq}</p></div><div><h3>Format, duration, fees, refunds</h3><p>${TBC}. These will be listed here in full before enrolment opens.</p></div><div><h3>Instructors</h3><p>See <a href="#/about">About</a> for real profiles.</p></div><div><h3>Assessment and support</h3><p>${TBC}.</p></div></div><p class="note">We do not guarantee jobs, salaries or business outcomes.</p>`,k!="sde")}
${closer("Ready to start?","Contact us","#/contact?topic="+encodeURIComponent(p.title))}`}

const PAGES={
"/":()=>`
<section class="dark"><div class="wrap hero"><div><p class="term">$ mms init --ai --engineers</p><h1>Building Engineers. Engineering <span class="g">Intelligent</span> Solutions.</h1>
<p class="lead">Massive Mission Solutions helps aspiring engineers develop practical AI and software development skills while helping businesses build technology that solves meaningful problems.</p>
${cta("Explore Training Programs","#/ai-engineering",1)}${cta("Build With Us","#/ai-solutions")}</div><canvas id="net" role="img" aria-label="Rotating 3D network of connected nodes"></canvas></div></section>
${sec("Inside an AI assistant",`<p>The pattern behind many knowledge assistants: find the right documents, let the model answer from them, then test the result.</p><div style="max-width:560px">${arch()}</div>`)}
${sec("Three pathways",`<div class="rows grid">
<div><h3>AI Engineering</h3><p>Learn to design and build AI-powered applications.</p><p><a href="#/ai-engineering">Explore AI Engineering</a></p></div>
<div><h3>Software Engineering</h3><p>Develop the fundamentals required to build reliable software.</p><p><a href="#/sde">Explore SDE Training</a></p></div>
<div><h3>AI Solutions</h3><p>Work with an engineering team to turn business challenges into practical technology.</p><p><a href="#/ai-solutions">Discuss Your AI Project</a></p></div></div>`,1)}
${sec("Our principles",`<div class="rows grid">${["Practical engineering over theory alone.","Transparent learning expectations.","Technology chosen to solve real problems.","Responsible and secure AI development.","Clear communication and measurable deliverables.","Continuous improvement through testing and feedback."].map(x=>`<div><p style="color:var(--ink)">${x}</p></div>`).join("")}</div><p class="note">These are the standards we hold ourselves to. We publish evidence on the <a href="#/projects">Projects</a> page rather than claims.</p>`)}
${sec("Who we serve",`<div class="rows grid"><div><h3>Students and graduates</h3><p>Build a project portfolio that shows real skills.</p></div><div><h3>Career switchers</h3><p>Learn software and AI fundamentals step by step.</p></div><div><h3>Working engineers</h3><p>Add LLM application, RAG and evaluation skills to what you already know.</p></div><div><h3>Businesses</h3><p>Get engineering help to prototype and ship AI features.</p></div></div>`,1)}
${sec("How learning works",`<ol class="steps"><li><strong>Choose a path</strong><br>AI Engineering or Software Engineering.</li><li><strong>Learn by building</strong><br>Every topic ends in a working project.</li><li><strong>Get feedback</strong><br>Code review and clear assessment criteria.</li><li><strong>Show your work</strong><br>Publish projects and repositories you can explain.</li></ol>`)}
${sec("Real Engineering. Practical Impact.",`<p>Every project is labelled as client work, internal project, prototype or concept, and shows its limits.</p>${cta("See projects","#/projects",1)}`,1)}`,
"/ai-engineering":()=>program("ai"),
"/sde":()=>sdePage(),
"/ai-solutions":()=>`
<section><div class="wrap"><h1>AI Solutions from ${SITE.divisions.labs}</h1><p class="lead">Practical AI and software engineering for business problems. Services listed are the capabilities we plan to offer; confirm availability for your project.</p>${cta("Discuss Your AI Project","#/contact?topic=AI%20Solutions",1)}</div></section>
${sec("What we build",`<div class="rows">${SERVICES.map(s=>`<div><h3>${s[0]}</h3><p><strong>Problem:</strong> ${s[1]}<br><strong>Approach:</strong> ${s[2]}<br><strong>Deliverables:</strong> ${s[3]}</p></div>`).join("")}</div>`,1)}
${sec("Technologies we work with",`<div>${["Python","TypeScript and React","LLM APIs","Vector search","SQL and NoSQL databases","Cloud deployment","Automated testing"].map(t=>`<span class="tag n">${t}</span> `).join("")}</div><p class="note" style="margin-top:20px">We choose tools per project. Sometimes the right answer is not AI at all.</p>`)}
${sec("What you can expect",`<ul class="chk"><li>Written scope and deliverables before work starts.</li><li>Working demos at each stage.</li><li>Your data handled under agreed access rules.</li><li>Known limitations documented, not hidden.</li></ul>`,1)}
${sec("How an engagement runs",`<ol class="steps">${li(PROCESS)}</ol><p style="margin-top:24px" class="note">Data privacy: we agree what data is used, where it is stored and who can access it during discovery, before any build.</p>`)}
${closer("Have a problem worth solving?","Start a conversation","#/contact?topic=AI%20Solutions")}`,
"/projects":()=>`
<section><div class="wrap"><h1>Real Engineering. Practical Impact.</h1><p class="lead">Each entry shows the problem, architecture, tools, testing, limits and verified outcomes. We never publish confidential work or invent results.</p></div></section>
${sec("Projects",`<div class="rows">${PROJECTS.map(p=>`<div><span class="tag ${p.status.startsWith('Concept')||p.status=='Prototype'?'n':''}">${p.status}</span><h3>${p.name}</h3><p><strong>Problem:</strong> ${p.problem}<br><strong>Architecture:</strong> ${p.arch}<br><strong>Tools:</strong> ${p.tools}<br><strong>Testing:</strong> ${p.testing}<br><strong>Limitations:</strong> ${p.limits}<br><strong>Verified outcomes:</strong> ${p.outcome}</p></div>`).join("")}</div><p class="note">Add completed work to PROJECTS in the script with its real status, repository link and demo link.</p>`,1)}
${closer("Want to see more or start a project?","Contact us","#/contact?topic=Projects")}`,
"/about":()=>`
<section><div class="wrap"><h1>About Massive Mission Solutions</h1><p class="lead">We develop engineering skills and build intelligent technology for real-world problems.</p></div></section>
${sec("Two parts, one standard",`<div class="rows"><div><h3>${SITE.divisions.academy}</h3><p>AI Engineering and Software Engineering training.</p></div><div><h3>${SITE.divisions.labs}</h3><p>AI solutions for businesses.</p></div></div><p class="note">Academy and Labs are proposed section names and can be changed in SITE.divisions.</p>`,1)}
${sec("Mission",`<p class="lead">We develop engineering skills and build intelligent technology for real-world problems.</p><p>People learn engineering by building, and businesses benefit most from AI that is tested, explained and maintained. Our training and our client work share the same habits: clear scope, working software and honest limits.</p>`)}
${sec("Team",`<div class="rows grid">${TEAM.map(t=>`<div><h3>${t.name}</h3><p><strong>${t.role}</strong><br>${t.bio}</p></div>`).join("")}</div>`)}
${sec("FAQ",FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join(""),1)}
${closer("Questions?","Contact us","#/contact")}`,
"/insights":()=>`
<section><div class="wrap"><h1>Technical Insights</h1><p class="lead">Notes on building, testing and teaching AI and software engineering.</p></div></section>
${sec("Articles",`<div class="rows">${ARTICLES.map(a=>`<div><h3>${a[0]}</h3><p>${a[1]} <span class="tag n">Draft topic</span></p></div>`).join("")}</div>`,1)}
${sec("Topics we cover",`<div>${["LLM applications","RAG and search","Evaluation and testing","AI agents","Software engineering basics","Responsible AI"].map(t=>`<span class="tag">${t}</span> `).join("")}</div>`)}
${closer("Want an article on a topic?","Send a suggestion","#/contact?topic=Insights")}`,
"/contact":()=>{const t=decodeURIComponent((location.hash.split("topic=")[1]||""));return `
<section><div class="wrap"><h1>Contact Us</h1><p class="lead">Tell us what you want to learn or build. Your message opens in WhatsApp, ready to send.</p>

/* ===== 3D network + reveal ===== */
function initNet(){
 const c=$("#net");if(!c)return;
 const x=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2),N=110,P=[],E=[];
 let W,H,t=0,mx=0,my=0;
 for(let i=0;i<N;i++){const k=i+.5,ph=Math.acos(1-2*k/N),th=Math.PI*(1+Math.sqrt(5))*k;P.push([Math.cos(th)*Math.sin(ph),Math.sin(th)*Math.sin(ph),Math.cos(ph)])}
 for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(Math.hypot(P[i][0]-P[j][0],P[i][1]-P[j][1],P[i][2]-P[j][2])<.5)E.push([i,j]);
 const size=()=>{const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
 size();addEventListener("resize",size);
 c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)/r.width-.5;my=(e.clientY-r.top)/r.height-.5});
 const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
 function frame(){
  if(!c.isConnected){removeEventListener("resize",size);return}
  t+=.006;
  const ay=t+mx*1.4,ax=.3+my*.9,R=Math.min(W,H)*.36,cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  const Q=P.map(p=>{const X=p[0]*cy+p[2]*sy,Z0=-p[0]*sy+p[2]*cy,Y=p[1]*cx-Z0*sx,Z=p[1]*sx+Z0*cx,s=2.6/(2.6+Z);return[W/2+X*R*s,H/2+Y*R*s,Z,s]});
  x.clearRect(0,0,W,H);
  x.lineWidth=1;
  E.forEach(([i,j])=>{const a=Q[i],b=Q[j],al=.06+.3*Math.max(0,(a[3]+b[3]-1.3)/1.9);x.strokeStyle=`rgba(77,214,232,${al})`;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke()});
  Q.forEach(q=>{x.fillStyle=`rgba(210,235,255,${Math.min(1,Math.max(.25,(q[3]-.6)))})`;x.beginPath();x.arc(q[0],q[1],1+1.8*q[3],0,6.283);x.fill()});
  for(let k=0;k<7;k++){const u=t*2+k*.37,e=E[(k*29+Math.floor(u)*17)%E.length],a=Q[e[0]],b=Q[e[1]],p=u%1,px=a[0]+(b[0]-a[0])*p,py=a[1]+(b[1]-a[1])*p;
   x.fillStyle="rgba(124,140,255,.35)";x.beginPath();x.arc(px,py,8,0,6.283);x.fill();x.fillStyle="#fff";x.beginPath();x.arc(px,py,2.6,0,6.283);x.fill()}
  if(!still)requestAnimationFrame(frame);
 }
 frame();
}
function reveal(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches||!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
 document.querySelectorAll("main section:not(.dark) .wrap").forEach(el=>{el.classList.add("rv");io.observe(el)});
}
